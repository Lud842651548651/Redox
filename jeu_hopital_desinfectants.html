<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Hygiène – Mission au CHU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Orbitron:wght@600;800&family=Manrope:wght@600;800&family=Bangers&family=Press+Start+2P&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5F7; --card:#FFFFFF; --ink:#1D2B36; --muted:#5B6B78;
  --teal:#0E7C86; --teal-l:#D7EEF0; --blue:#2F6FB3; --blue-l:#E3EEFA;
  --green:#2E8B57; --green-l:#E2F4EA; --red:#C0392B; --red-l:#FBE7E4;
  --amber:#B7791F; --amber-l:#FFF4DC; --line:#D3DEE5;
  --fs:18px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Arial,sans-serif;line-height:1.5}
.iode{font-family:"Times New Roman",Times,"Liberation Serif",serif}
sub,sup{font-size:.7em;line-height:0}
button{font:inherit;cursor:pointer}
header{background:var(--teal);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.05rem}
header .cross{width:30px;height:30px;background:#fff;border-radius:6px;position:relative;flex:none}
header .cross:before,header .cross:after{content:"";position:absolute;background:var(--red);left:50%;top:50%;transform:translate(-50%,-50%)}
header .cross:before{width:18px;height:6px}
header .cross:after{width:6px;height:18px}
header .who{font-size:.85rem;opacity:.9}
header .sp{flex:1}
header .hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:.25rem .7rem;font-size:.85rem}
header .hbtn:hover{background:rgba(255,255,255,.28)}
main{max-width:860px;margin:0 auto;padding:1rem}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:1.2rem 1.3rem;margin:1rem 0}
h1{font-size:1.6rem;margin:.2rem 0 .6rem;color:var(--teal)}
h2{font-size:1.25rem;margin:.2rem 0 .6rem;color:var(--teal)}
h3{font-size:1.05rem;margin:1rem 0 .3rem;color:var(--blue)}
p{margin:.4rem 0}
label{display:block;font-weight:700;margin:.6rem 0 .2rem}
input[type=text]{font:inherit;width:100%;padding:.5rem .7rem;border:2px solid var(--line);border-radius:8px}
input[type=text]:focus,input.coef:focus{outline:3px solid var(--blue-l);border-color:var(--blue)}
.btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:.6rem 1.2rem;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:#9FB3BD;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
/* carte des étapes */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.step{border:2px solid var(--line);border-radius:14px;padding:1rem;background:#fff;display:flex;flex-direction:column;gap:.4rem}
.step .num{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.locked{opacity:.55}
.step.locked .num{background:#9FB3BD}
.step.done{border-color:var(--green);background:var(--green-l)}
.step.done .num{background:var(--green)}
.step .lieu{color:var(--muted);font-size:.9rem}
.step .etat{font-size:.9rem;font-weight:700}
.step .btn{margin-top:auto}
/* cours */
.cours{border-left:6px solid var(--amber);background:var(--amber-l);border-radius:10px;padding:.8rem 1rem}
.cours .eq{text-align:center;font-size:1.1rem;margin:.5rem 0}
.retenir{border:2px solid var(--amber);border-radius:10px;padding:.6rem .9rem;background:#fff;margin:.6rem 0}
/* questions */
.dots{display:flex;gap:.4rem;margin:.2rem 0 .8rem}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);background:#fff}
.dot.cur{border-color:var(--blue);color:var(--blue);font-weight:700}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.ko{background:var(--red);border-color:var(--red);color:#fff}
.enonce{font-size:1.05rem}
.donnees{background:var(--blue-l);border-radius:10px;padding:.5rem .9rem;margin:.6rem 0}
.donnees .eq{margin:.2rem 0}
.choices{display:grid;gap:.5rem;margin:.8rem 0}
.choice{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:.6rem .9rem}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice.sel{border-color:var(--blue);background:var(--blue-l)}
.choice.good{border-color:var(--green);background:var(--green-l)}
.choice.bad{border-color:var(--red);background:var(--red-l)}
.choice:disabled{cursor:default}
.pictos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin:.8rem 0}
.picto{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.5rem;display:flex;flex-direction:column;align-items:center}
.picto img{width:88px;height:88px}
.picto span{font-size:.8rem;color:var(--muted)}
.picto.sel{border-color:var(--blue);background:var(--blue-l)}
.picto.good{border-color:var(--green);background:var(--green-l)}
.picto.bad{border-color:var(--red);background:var(--red-l)}
.demiswrap{display:flex;overflow-x:auto;margin-top:.3rem}
.demis{display:grid;grid-template-columns:auto max-content auto max-content;column-gap:.45em;row-gap:.35em;align-items:center;margin:0 auto 0 0;white-space:nowrap;font-size:1em}
.demis .ctrl{display:flex;gap:.35em;align-items:center}
.demis .dl{justify-self:end}
.demis .de{justify-self:center}
.inv{font:inherit;font-weight:700;min-width:2em;padding:0 .3em;border-radius:8px;border:2px solid var(--blue);background:var(--card);color:var(--blue)}
.inv.on{background:var(--blue);color:var(--card)}
.inv:disabled{opacity:.6;cursor:default}
.mult{display:inline-flex;align-items:center;gap:.25rem;font-weight:700;margin:0}
.mult select{font:inherit;padding:.1rem .3rem;border-radius:8px;border:2px solid var(--blue);background:var(--card);color:var(--ink)}
.eqline{font-size:1.15rem;margin:1rem 0;line-height:1.9;display:flex;overflow-x:auto;padding:.2rem 0}
.eqline .eqin{margin:0 auto;white-space:nowrap}
.eqline .op{margin:0 .22em}
input.coef{width:1.7em;height:1.6em;text-align:center;font:inherit;font-weight:700;padding:0;border:2px solid var(--blue);border-radius:6px;margin:0 .14em 0 0;vertical-align:middle}
input.coef.good{border-color:var(--green);background:var(--green-l)}
input.coef.bad{border-color:var(--red);background:var(--red-l)}
.hints{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0}
.hint-btn{background:var(--amber-l);border:2px solid var(--amber);color:#7A4F0A;border-radius:10px;padding:.35rem .8rem;font-size:.9rem}
.hint-btn:disabled{opacity:.5;cursor:not-allowed}
.hint{background:var(--amber-l);border-radius:10px;padding:.5rem .8rem;margin:.4rem 0;font-size:.95rem}
.fb{border-radius:10px;padding:.6rem .9rem;margin:.7rem 0}
.fb.good{background:var(--green-l);border-left:6px solid var(--green)}
.fb.bad{background:var(--red-l);border-left:6px solid var(--red)}
.score{font-size:2.2rem;font-weight:700;text-align:center;margin:.5rem 0}
.center{text-align:center}
.note{font-size:.85rem;color:var(--muted)}
.status{margin-top:.6rem;font-size:.95rem}
.hidden{display:none}
.big{font-size:3rem;line-height:1}
@media (max-width:560px){
  main{padding:.4rem}.card{padding:.9rem .8rem}
  header{position:relative;padding:.45rem .6rem;gap:.4rem}
  header .logo{font-size:.9rem} header .who{display:none}
  header .hbtn .lbl{display:none} header .hbtn{padding:.2rem .55rem}
  #btnSend{font-size:.8rem}
}

/* =====================================================================
   THÈMES : body[data-theme="neon|clean|comic|pixel|bio"]
   ===================================================================== */
html,body{min-height:100vh}
body{background-attachment:fixed}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
main,header{position:relative;z-index:1}
header{position:sticky}
.ecg{display:none}

/* ---------- 1. URGENCES NÉON ---------- */
body[data-theme="neon"]{
  --bg:#070B14; --card:#0F1626; --ink:#E6F1FF; --muted:#8FA3BF; --line:#243250;
  --teal:#00F0FF; --teal-l:#08303A; --blue:#00F0FF; --blue-l:#0B2A3A;
  --green:#39FF88; --green-l:#0C2E1E; --red:#FF3D71; --red-l:#33111D;
  --amber:#FFC94D; --amber-l:#2A220C;
  background:radial-gradient(circle at 20% 0%,#10213F 0,transparent 50%),radial-gradient(circle at 100% 100%,#2A0D2E 0,transparent 45%),#070B14;
}
body[data-theme="neon"] h1,body[data-theme="neon"] h2,body[data-theme="neon"] header .logo,body[data-theme="neon"] .score{font-family:"Orbitron",sans-serif;letter-spacing:.04em}
body[data-theme="neon"] h1,body[data-theme="neon"] h2{color:#00F0FF;text-shadow:0 0 12px rgba(0,240,255,.6)}
body[data-theme="neon"] h3{color:#FF3D71}
body[data-theme="neon"] header{background:rgba(7,11,20,.85);backdrop-filter:blur(8px);border-bottom:1px solid #00F0FF55;box-shadow:0 0 24px rgba(0,240,255,.25)}
body[data-theme="neon"] .ecg{display:block;position:absolute;left:0;right:0;width:100%;bottom:-2px;height:22px;opacity:.9}
body[data-theme="neon"] .ecg path{stroke:#39FF88;stroke-width:2;fill:none;filter:drop-shadow(0 0 4px #39FF88);stroke-dasharray:1400;stroke-dashoffset:1400;animation:ecg var(--ecg-t,1.6s) linear infinite}
@keyframes ecg{to{stroke-dashoffset:0}}
body[data-theme="neon"] .card{border:1px solid #00F0FF33;box-shadow:0 0 0 1px #00F0FF11,0 10px 40px rgba(0,0,0,.5),inset 0 0 40px rgba(0,240,255,.04)}
body[data-theme="neon"] .btn{background:transparent;color:#00F0FF;border:2px solid #00F0FF;box-shadow:0 0 14px rgba(0,240,255,.45),inset 0 0 10px rgba(0,240,255,.2);text-transform:uppercase;letter-spacing:.06em}
body[data-theme="neon"] .btn:hover{background:#00F0FF;color:#070B14}
body[data-theme="neon"] .btn.ghost{color:#FF3D71;border-color:#FF3D71;box-shadow:0 0 12px rgba(255,61,113,.4)}
body[data-theme="neon"] .btn:disabled{color:#4A5A75;border-color:#2A3650;box-shadow:none;background:transparent}
body[data-theme="neon"] .step{background:#0B1220}
body[data-theme="neon"] .step.done{box-shadow:0 0 18px rgba(57,255,136,.35)}
body[data-theme="neon"] .num{box-shadow:0 0 12px currentColor}
body[data-theme="neon"] .choice,body[data-theme="neon"] .picto{background:#0B1220;color:var(--ink)}
body[data-theme="neon"] .choice:hover:not(:disabled){box-shadow:0 0 12px rgba(0,240,255,.4)}
body[data-theme="neon"] .picto img{background:#fff;border-radius:8px}
body[data-theme="neon"] input[type=text],body[data-theme="neon"] input.coef{background:#0B1220;color:#fff;border-color:#2A3A5C}
body[data-theme="neon"] .cours{background:#14130A;color:#F4ECD0}
body[data-theme="neon"] .hint-btn{background:#2A220C;color:#FFC94D}
body[data-theme="neon"] .dot{background:#0B1220}
body[data-theme="neon"] .score{color:#39FF88;text-shadow:0 0 18px #39FF88}

/* ---------- 2. BLOUSE BLANCHE (clinique épuré) ---------- */
body[data-theme="clean"]{
  --bg:#F4F7F6; --card:#FFFFFF; --ink:#13201C; --muted:#64736E; --line:#E1E8E5;
  --teal:#0F9D7A; --teal-l:#DDF3EC; --blue:#3355FF; --blue-l:#E8ECFF;
  --green:#0F9D7A; --green-l:#E0F5EE; --red:#E5484D; --red-l:#FDECEC; --amber:#E8A10C; --amber-l:#FFF6E0;
  background:linear-gradient(180deg,#E8F4F0 0,#F4F7F6 320px);
}
body[data-theme="clean"] h1,body[data-theme="clean"] h2,body[data-theme="clean"] header .logo,body[data-theme="clean"] .score{font-family:"Manrope",sans-serif;font-weight:800;letter-spacing:-.02em}
body[data-theme="clean"] h1{font-size:2.2rem;color:var(--ink)}
body[data-theme="clean"] h2{color:var(--ink)}
body[data-theme="clean"] header{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);color:var(--ink);border-bottom:1px solid var(--line)}
body[data-theme="clean"] header .hbtn{color:var(--ink);border-color:var(--line);background:#fff}
body[data-theme="clean"] header .cross{background:var(--teal)}
body[data-theme="clean"] header .cross:before,body[data-theme="clean"] header .cross:after{background:#fff}
body[data-theme="clean"] .card{border-radius:24px;box-shadow:0 1px 2px rgba(16,40,32,.04),0 12px 32px rgba(16,40,32,.08);padding:1.6rem 1.8rem}
body[data-theme="clean"] .btn{border-radius:999px;padding:.7rem 1.5rem;box-shadow:0 6px 16px rgba(15,157,122,.3)}
body[data-theme="clean"] .btn.ghost{box-shadow:none;border-radius:999px}
body[data-theme="clean"] .btn:disabled{box-shadow:none}
body[data-theme="clean"] .step{border:none;border-radius:20px;background:#F8FBFA;box-shadow:inset 0 0 0 1px var(--line)}
body[data-theme="clean"] .step.done{box-shadow:inset 0 0 0 2px var(--green)}
body[data-theme="clean"] .choice,body[data-theme="clean"] .picto{border-radius:16px;border-width:1.5px}
body[data-theme="clean"] .cours{border-left:none;border-radius:18px;background:#FFF9EC}
body[data-theme="clean"] .dot{border-radius:8px}

/* ---------- 3. BANDE DESSINÉE ---------- */
body[data-theme="comic"]{
  --bg:#FFE45C; --card:#FFFFFF; --ink:#111; --muted:#333; --line:#111;
  --teal:#FF3B30; --teal-l:#FFE1DE; --blue:#1E6BFF; --blue-l:#DCE8FF;
  --green:#18B85A; --green-l:#D9F7E5; --red:#FF3B30; --red-l:#FFE1DE; --amber:#111; --amber-l:#FFF7C2;
  background-color:#FFE45C;
  background-image:radial-gradient(#E8C200 1.6px,transparent 1.7px);background-size:14px 14px;
}
body[data-theme="comic"] h1,body[data-theme="comic"] h2,body[data-theme="comic"] header .logo,body[data-theme="comic"] .score,body[data-theme="comic"] .btn,body[data-theme="comic"] .num{font-family:"Bangers",cursive;letter-spacing:.06em;font-weight:400}
body[data-theme="comic"] h1{font-size:2.6rem;color:#FF3B30;-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 #111}
body[data-theme="comic"] h2{font-size:1.6rem;color:#1E6BFF;text-shadow:2px 2px 0 #111}
body[data-theme="comic"] header{background:#1E6BFF;border-bottom:4px solid #111}
body[data-theme="comic"] header .logo{font-size:1.4rem;text-shadow:2px 2px 0 #111}
body[data-theme="comic"] .card{border:4px solid #111;border-radius:6px;box-shadow:8px 8px 0 #111;transform:rotate(-.3deg)}
body[data-theme="comic"] .btn{border:3px solid #111;border-radius:6px;box-shadow:4px 4px 0 #111;font-size:1.25rem;background:#FF3B30}
body[data-theme="comic"] .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}
body[data-theme="comic"] .btn.ghost{background:#fff;color:#111}
body[data-theme="comic"] .btn:disabled{background:#bbb;box-shadow:2px 2px 0 #111}
body[data-theme="comic"] .step{border:3px solid #111;border-radius:6px;box-shadow:4px 4px 0 #111}
body[data-theme="comic"] .step:nth-child(2){transform:rotate(.6deg)}
body[data-theme="comic"] .step:nth-child(3){transform:rotate(-.6deg)}
body[data-theme="comic"] .step.done{background:#D9F7E5}
body[data-theme="comic"] .num{border:3px solid #111;font-size:1.3rem}
body[data-theme="comic"] .choice,body[data-theme="comic"] .picto{border:3px solid #111;border-radius:6px;box-shadow:3px 3px 0 #111}
body[data-theme="comic"] .choice:hover:not(:disabled){background:#FFF7C2}
body[data-theme="comic"] .cours{border:3px solid #111;border-radius:18px;background:#fff;position:relative}
body[data-theme="comic"] .enonce{background:#fff;border:3px solid #111;border-radius:22px;padding:.7rem 1rem;position:relative;margin-bottom:1.2rem}
body[data-theme="comic"] .enonce:after{content:"";position:absolute;left:40px;bottom:-16px;border:14px solid transparent;border-top-color:#111;border-bottom:0}
body[data-theme="comic"] .hint-btn{border:3px solid #111;background:#FFF7C2;color:#111;box-shadow:2px 2px 0 #111}
body[data-theme="comic"] .dot{border:2px solid #111}
body[data-theme="comic"] input.coef,body[data-theme="comic"] input[type=text]{border:3px solid #111;border-radius:6px}
body[data-theme="comic"] .fb{border:3px solid #111;border-left-width:3px;box-shadow:3px 3px 0 #111}
body[data-theme="comic"] .score{font-size:4rem;color:#FF3B30;-webkit-text-stroke:2px #111;text-shadow:4px 4px 0 #111}

/* ---------- 4. ARCADE PIXEL ---------- */
body[data-theme="pixel"]{
  --bg:#1A1C2C; --card:#262B44; --ink:#F4F4F4; --muted:#94B0C2; --line:#566C86;
  --teal:#41A6F6; --teal-l:#1F3B5C; --blue:#41A6F6; --blue-l:#1F3B5C;
  --green:#38B764; --green-l:#1E3D2C; --red:#E43B44; --red-l:#47202A; --amber:#FFCD75; --amber-l:#3D3424;
  background:#1A1C2C;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px;
}
body[data-theme="pixel"] h1,body[data-theme="pixel"] h2,body[data-theme="pixel"] header .logo,body[data-theme="pixel"] .score,body[data-theme="pixel"] .btn,body[data-theme="pixel"] .num,body[data-theme="pixel"] .dot{font-family:"Press Start 2P",monospace;font-weight:400}
body[data-theme="pixel"] h1{font-size:1.3rem;color:#FFCD75;text-shadow:3px 3px 0 #B13E53;line-height:1.6}
body[data-theme="pixel"] h2{font-size:.95rem;color:#73EFF7;line-height:1.6}
body[data-theme="pixel"] h3{color:#FFCD75}
body[data-theme="pixel"] header{background:#333C57;border-bottom:4px solid #000}
body[data-theme="pixel"] header .logo{font-size:.75rem}
body[data-theme="pixel"] header .hbtn{border-radius:0;border:2px solid #000;background:#566C86}
body[data-theme="pixel"] .card{border-radius:0;box-shadow:0 0 0 4px #000,8px 8px 0 4px #000;border:4px solid #94B0C2}
body[data-theme="pixel"] .btn{border-radius:0;font-size:.7rem;padding:.9rem 1.1rem;background:#38B764;color:#000;box-shadow:inset -4px -4px 0 #257953,inset 4px 4px 0 #A7F070,0 0 0 3px #000}
body[data-theme="pixel"] .btn.ghost{background:#94B0C2;color:#000;border:none;box-shadow:inset -4px -4px 0 #566C86,inset 4px 4px 0 #F4F4F4,0 0 0 3px #000}
body[data-theme="pixel"] .btn:active{transform:translateY(2px)}
body[data-theme="pixel"] .btn:disabled{background:#566C86;box-shadow:0 0 0 3px #000}
body[data-theme="pixel"] .step{border-radius:0;background:#333C57;border:3px solid #000}
body[data-theme="pixel"] .step.done{background:#1E3D2C;border-color:#38B764}
body[data-theme="pixel"] .num,body[data-theme="pixel"] .dot{border-radius:0;font-size:.6rem}
body[data-theme="pixel"] .choice,body[data-theme="pixel"] .picto{border-radius:0;background:#333C57;color:var(--ink);border:3px solid #000}
body[data-theme="pixel"] .choice:hover:not(:disabled):before{content:"▶ ";color:#FFCD75}
body[data-theme="pixel"] .picto img{background:#fff;image-rendering:pixelated}
body[data-theme="pixel"] .cours{border-radius:0;background:#2E2A22;color:#F4F4F4}
body[data-theme="pixel"] .hint-btn{border-radius:0;background:#3D3424;color:#FFCD75}
body[data-theme="pixel"] input[type=text],body[data-theme="pixel"] input.coef{border-radius:0;background:#1A1C2C;color:#fff;border:3px solid #94B0C2}
body[data-theme="pixel"] .fb{border-radius:0}
body[data-theme="pixel"] .score{font-size:1.8rem;color:#FFCD75;text-shadow:4px 4px 0 #B13E53}
body[data-theme="pixel"] .big{filter:drop-shadow(4px 4px 0 #000)}

/* ---------- 5. MICROSCOPE / BIO ---------- */
body[data-theme="bio"]{
  --bg:#0D1B2A; --card:rgba(255,255,255,.1); --ink:#F1F7F4; --muted:#B8CBC4; --line:rgba(255,255,255,.22);
  --teal:#7CF29C; --teal-l:rgba(124,242,156,.15); --blue:#B892FF; --blue-l:rgba(184,146,255,.18);
  --green:#7CF29C; --green-l:rgba(124,242,156,.18); --red:#FF7A8A; --red-l:rgba(255,122,138,.18); --amber:#FFD166; --amber-l:rgba(255,209,102,.14);

body[data-theme="bio"] h1,body[data-theme="bio"] h2,body[data-theme="bio"] header .logo,body[data-theme="bio"] .score{font-family:"Fredoka",sans-serif;font-weight:600}
body[data-theme="bio"] h1{font-size:2.2rem;background:linear-gradient(90deg,#7CF29C,#B892FF);-webkit-background-clip:text;background-clip:text;color:transparent}
body[data-theme="bio"] h2{color:#7CF29C}
body[data-theme="bio"] h3{color:#B892FF}
body[data-theme="bio"] header{background:rgba(13,27,42,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body[data-theme="bio"] .card{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
body[data-theme="bio"] .btn{border-radius:999px;background:linear-gradient(90deg,#7CF29C,#4FD1C5);color:#0D1B2A}
body[data-theme="bio"] .btn.ghost{background:transparent;color:#7CF29C;border:2px solid #7CF29C}
body[data-theme="bio"] .btn:disabled{background:rgba(255,255,255,.15);color:#7C8F99}
body[data-theme="bio"] .step{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:22px}
body[data-theme="bio"] .step.done{background:rgba(124,242,156,.12);border-color:#7CF29C}
body[data-theme="bio"] .num{color:#0D1B2A}
body[data-theme="bio"] .choice,body[data-theme="bio"] .picto{background:rgba(255,255,255,.06);color:var(--ink);border-radius:18px;border-color:var(--line)}
body[data-theme="bio"] .picto img{background:#fff;border-radius:12px}
body[data-theme="bio"] input[type=text],body[data-theme="bio"] input.coef{background:rgba(255,255,255,.08);color:#fff;border-color:var(--line)}
body[data-theme="bio"] .cours{border-radius:18px;color:var(--ink)}
body[data-theme="bio"] .hint-btn{background:rgba(255,209,102,.15);color:#FFD166;border-color:#FFD166;border-radius:999px}
body[data-theme="bio"] .dot{background:transparent}
body[data-theme="bio"] .blob{position:absolute;border-radius:50%;opacity:.55;animation:float 18s ease-in-out infinite}
body[data-theme="bio"] .bact{position:absolute;opacity:.5;animation:float 22s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,-40px) rotate(20deg)}}

eur", "ni l'un ni l'autre", "un acide"], "bonne": 0, "pouces": ["Regarde comment le couple est écrit : Ox/Red.", "H_2O_2 est écrit à gauche du « / »."], "expl": "Dans H_2O_2/H_2O, H_2O_2 est écrit en premier : c'est l'oxydant (H_2O_2 + 2 H^+ + 2 e^- = 2 H_2O)."}, {"type": "qcm", "id": "1f", "enonce": "Les poignées de porte du couloir sont en cuivre : Cu = Cu^{2+} + 2 e^-. Que subit le cuivre Cu ?", "choix": ["une oxydation", "une réduction", "ni l'une ni l'autre", "une neutralisation"], "bonne": 0, "pouces": ["Le cuivre perd-il ou gagne-t-il des électrons ?", "Oxydation = perte d'électrons ; réduction = gain d'électrons."], "expl": "Le cuivre cède 2 électrons : il subit une oxydation (c'est un réducteur)."}, {"type": "qcm", "id": "1g", "enonce": "Quelle particule est échangée entre l'oxydant et le réducteur d'un couple ?", "choix": ["l'électron e^-", "le proton H^+", "l'ion hydroxyde HO^-", "l'atome d'oxygène"], "bonne": 0, "pouces": ["Le proton H^+ est échangé dans les réactions acide-base.", "Regarde la demi-équation Ox + n e^- = Red."], "expl": "En oxydoréduction, la particule échangée est l'électron."}, {"type": "qcm", "id": "1h", "enonce": "Une réduction correspond à…", "choix": ["un gain d'électrons", "une perte d'électrons", "un gain de protons", "une perte de protons"], "bonne": 0, "pouces": ["C'est ce que subit un oxydant.", "Un oxydant capte des électrons."], "expl": "Une réduction est un gain d'électrons : c'est l'oxydant qui est réduit."}, {"type": "qcm", "id": "1i", "enonce": "Un patient anémié prend des comprimés de fer. Demi-équation : Fe^{3+} + e^- = Fe^{2+}. Que représente l'ion Fe^{2+} dans ce couple ?", "choix": ["le réducteur", "l'oxydant", "un électron", "un acide"], "bonne": 0, "pouces": ["Où se trouve l'électron dans la demi-équation ?", "L'électron est avec Fe^{3+} : Fe^{2+} est de l'autre côté."], "expl": "Fe^{2+} est du côté opposé à l'électron : c'est le réducteur du couple Fe^{3+}/Fe^{2+}."}, {"type": "qcm", "id": "1j", "enonce": "En dermatologie, on utilise des bains de permanganate : MnO_4^- + 8 H^+ + 5 e^- = Mn^{2+} + 4 H_2O. Combien d'électrons l'oxydant capte-t-il ?", "choix": ["5", "8", "4", "2"], "bonne": 0, "pouces": ["Cherche le nombre écrit devant e^-.", "8 est le nombre d'ions H^+, pas d'électrons."], "expl": "Le coefficient devant e^- est 5 : l'ion permanganate capte 5 électrons."}, {"type": "qcm", "id": "1k", "enonce": "Le peroxyde d'hydrogène appartient aussi au couple O_2/H_2O_2 : O_2 + 2 H^+ + 2 e^- = H_2O_2. Dans ce couple, H_2O_2 est…", "choix": ["le réducteur", "l'oxydant", "un électron", "un ion"], "bonne": 0, "pouces": ["Les électrons sont à gauche, avec O_2.", "H_2O_2 est donc de l'autre côté des électrons."], "expl": "Dans O_2/H_2O_2, H_2O_2 est le réducteur : c'est pour ça que l'eau oxygénée peut réagir avec elle-même et vieillir."}, {"type": "qcm", "id": "1l", "enonce": "Quand l'oxydant d'un couple capte des électrons, il se transforme en…", "choix": ["son réducteur conjugué", "un autre oxydant", "électrons libres", "eau"], "bonne": 0, "pouces": ["Ox + n e^- = Red : que trouve-t-on à droite ?", "Les deux espèces d'un couple sont dites conjuguées."], "expl": "En captant des électrons, l'oxydant devient le réducteur du même couple (son réducteur conjugué)."}, {"type": "qcm", "id": "1m", "enonce": "Un réducteur est une espèce chimique capable de…", "choix": ["céder un ou plusieurs électrons", "capter un ou plusieurs électrons", "céder un ou plusieurs ions H^+", "capter un ou plusieurs ions HO^-"], "bonne": 0, "pouces": ["Pense à l'astuce : le Réducteur Rend des électrons.", "Les ions H^+ et HO^- concernent les acides et les bases."], "expl": "Un réducteur cède (rend) des électrons."}, {"type": "qcm", "id": "1n", "enonce": "Les ions cuivre libérés par les poignées appartiennent au couple Cu^{2+}/Cu. Quel est l'oxydant de ce couple ?", "choix": ["Cu^{2+}", "Cu", "e^-", "il n'y a pas d'oxydant"], "bonne": 0, "pouces": ["Un couple s'écrit toujours Ox/Red.", "L'espèce écrite avant le « / » est l'oxydant."], "expl": "Dans Cu^{2+}/Cu, l'oxydant est l'ion Cu^{2+} : Cu^{2+} + 2 e^- = Cu."}, {"type": "qcm", "id": "1o", "enonce": "Une oxydation correspond à…", "choix": ["une perte d'électrons", "un gain d'électrons", "une perte de protons H^+", "un gain d'atomes d'oxygène seulement"], "bonne": 0, "pouces": ["C'est ce que subit un réducteur.", "Un réducteur cède des électrons."], "expl": "Une oxydation est une perte d'électrons : c'est le réducteur qui est oxydé."}, {"type": "qcm", "id": "1p", "enonce": "Le dichlore se forme quand on mélange eau de Javel et détartrant. Dans la demi-équation Cl_2 + 2 e^- = 2 Cl^-, le dichlore Cl_2 est…", "choix": ["l'oxydant", "le réducteur", "un ion", "un acide"], "bonne": 0, "pouces": ["Cherche de quel côté sont les électrons.", "L'espèce du même côté que les électrons est l'oxydant."], "expl": "Cl_2 est du côté des électrons : c'est l'oxydant du couple Cl_2/Cl^-."}, {"type": "qcm", "id": "1q", "enonce": "Un ion argent Ag^+ d'un pansement capte un électron arraché à une bactérie : Ag^+ + e^- → Ag. Que subit l'ion Ag^+ ?", "choix": ["une réduction", "une oxydation", "une neutralisation", "une dilution"], "bonne": 0, "pouces": ["L'ion Ag^+ gagne-t-il ou perd-il un électron ?", "Réduction = gain d'électrons."], "expl": "Ag^+ gagne un électron : il subit une réduction (c'est un oxydant)."}, {"type": "qcm", "id": "1r", "enonce": "Dans une demi-équation d'oxydoréduction, où se trouvent les électrons ?", "choix": ["du même côté que l'oxydant", "du même côté que le réducteur", "des deux côtés", "nulle part"], "bonne": 0, "pouces": ["Rappelle-toi l'écriture générale Ox + n e^- = Red.", "L'oxydant capte les électrons : ils sont avec lui."], "expl": "Ox + n e^- = Red : les électrons sont du côté de l'oxydant."}, {"type": "qcm", "id": "1s", "enonce": "La vitamine C est un « antioxydant » : C_6H_6O_6 + 2 H^+ + 2 e^- = C_6H_8O_6. La vitamine C (C_6H_8O_6) est…", "choix": ["un réducteur", "un oxydant", "un acide fort", "un électron"], "bonne": 0, "pouces": ["Où se trouve C_6H_8O_6 par rapport aux électrons ?", "Un antioxydant protège les cellules en cédant ses électrons aux oxydants."], "expl": "C_6H_8O_6 est du côté opposé aux électrons : c'est un réducteur."}, {"type": "qcm", "id": "1t", "enonce": "L'alcool à 70° est un antiseptique, mais ce n'est pas un oxydant. Comment agit-il sur les micro-organismes ?", "choix": ["il dénature leurs protéines et dissout les lipides de leur membrane", "il arrache des électrons à leurs molécules", "il les neutralise comme une base", "il les dilue"], "bonne": 0, "pouces": ["Le test avec l'iodure de potassium ne donne rien avec l'alcool.", "L'alcool modifie la forme des protéines, comme la cuisson d'un blanc d'œuf."], "expl": "L'alcool dénature les protéines et dissout les lipides membranaires : il n'agit pas par oxydation."}], [{"type": "eq", "id": "2a", "enonce": "Test de l'eau oxygénée : en milieu acide (H^+_{(aq)}), le peroxyde d'hydrogène H_2O_2_{(aq)} oxyde les ions iodure d'une solution d'iodure de potassium (K^+_{(aq)} + I^-_{(aq)}) ; il se forme du diiode I_2_{(aq)} et de l'eau H_2O_{(l)}.", "demis": [{"g": [["H_2O_2", 1], ["H^+", 2], ["e^-", 2]], "d": [["H_2O", 2]]}, {"g": [["I_2", 1], ["e^-", 2]], "d": [["I^-", 2]]}], "g": [["H_2O_2", 1], ["H^+", 2], ["I^-", 2]], "d": [["H_2O", 2], ["I_2", 1]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Écris la demi-équation du diiode à l'envers : 2 I^- → I_2 + 2 e^-, puis additionne."], "expl": "H_2O_2 + 2 H^+ + 2 I^- → 2 H_2O + I_2."}, {"type": "eq", "id": "2b", "enonce": "La poignée en cuivre Cu_{(s)} réagit avec le dioxygène dissous O_2_{(aq)} en présence de la sueur, qui apporte des ions H^+_{(aq)} ; il se forme des ions cuivre Cu^{2+}_{(aq)} et de l'eau H_2O_{(l)}.", "demis": [{"g": [["Cu^{2+}", 1], ["e^-", 2]], "d": [["Cu", 1]]}, {"g": [["O_2", 1], ["H^+", 4], ["e^-", 4]], "d": [["H_2O", 2]]}], "g": [["Cu", 2], ["O_2", 1], ["H^+", 4]], "d": [["Cu^{2+}", 2], ["H_2O", 2]], "pouces": ["La première demi-équation échange 2 électrons, la seconde 4 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Multiplie la demi-équation du cuivre par 2 pour avoir 4 électrons."], "expl": "(Cu → Cu^{2+} + 2 e^-) × 2 : 2 Cu + O_2 + 4 H^+ → 2 Cu^{2+} + 2 H_2O."}, {"type": "eq", "id": "2c", "enonce": "Une agente a mélangé de l'eau de Javel (Na^+_{(aq)} + ClO^-_{(aq)} + Cl^-_{(aq)}) et un détartrant à l'acide chlorhydrique (H^+_{(aq)} + Cl^-_{(aq)}) : les ions hypochlorite réagissent avec les ions chlorure et il se dégage du dichlore Cl_2_{(g)}.", "demis": [{"g": [["ClO^-", 2], ["H^+", 4], ["e^-", 2]], "d": [["Cl_2", 1], ["H_2O", 2]]}, {"g": [["Cl_2", 1], ["e^-", 2]], "d": [["Cl^-", 2]]}], "g": [["ClO^-", 1], ["Cl^-", 1], ["H^+", 2]], "d": [["Cl_2", 1], ["H_2O", 1]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Après l'addition, Cl_2 apparaît deux fois à droite et tous les nombres sont pairs : simplifie par 2."], "expl": "2 ClO^- + 2 Cl^- + 4 H^+ → 2 Cl_2 + 2 H_2O, puis on divise par 2 : ClO^- + Cl^- + 2 H^+ → Cl_2 + H_2O."}, {"type": "eq", "id": "2d", "enonce": "Le vieux flacon d'eau oxygénée du chariot de soins s'est décomposé : le peroxyde d'hydrogène H_2O_2_{(aq)} réagit avec lui-même et se transforme en eau H_2O_{(l)} et en dioxygène O_2_{(g)}.", "demis": [{"g": [["H_2O_2", 1], ["H^+", 2], ["e^-", 2]], "d": [["H_2O", 2]]}, {"g": [["O_2", 1], ["H^+", 2], ["e^-", 2]], "d": [["H_2O_2", 1]]}], "g": [["H_2O_2", 2]], "d": [["H_2O", 2], ["O_2", 1]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Écris la seconde demi-équation à l'envers ; après l'addition, les ions H^+ se simplifient."], "expl": "H_2O_2 + 2 H^+ + 2 e^- → 2 H_2O et H_2O_2 → O_2 + 2 H^+ + 2 e^- : 2 H_2O_2 → 2 H_2O + O_2."}, {"type": "eq", "id": "2e", "enonce": "Au laboratoire, un fil de cuivre Cu_{(s)} plongé dans une solution de nitrate d'argent (Ag^+_{(aq)} + NO_3^-_{(aq)}) se couvre d'argent Ag_{(s)} et la solution bleuit (ions Cu^{2+}_{(aq)}) : c'est l'« arbre de Diane ».", "demis": [{"g": [["Ag^+", 1], ["e^-", 1]], "d": [["Ag", 1]]}, {"g": [["Cu^{2+}", 1], ["e^-", 2]], "d": [["Cu", 1]]}], "g": [["Ag^+", 2], ["Cu", 1]], "d": [["Ag", 2], ["Cu^{2+}", 1]], "pouces": ["La première demi-équation échange 1 électron, la seconde 2 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Multiplie la demi-équation de l'argent par 2."], "expl": "(Ag^+ + e^- → Ag) × 2 : 2 Ag^+ + Cu → 2 Ag + Cu^{2+}."}, {"type": "eq", "id": "2f", "enonce": "Le laboratoire contrôle un médicament contenant des ions fer(II) Fe^{2+}_{(aq)} avec une solution acidifiée de permanganate de potassium (K^+_{(aq)} + MnO_4^-_{(aq)}) ; il se forme des ions Mn^{2+}_{(aq)} et Fe^{3+}_{(aq)}.", "demis": [{"g": [["MnO_4^-", 1], ["H^+", 8], ["e^-", 5]], "d": [["Mn^{2+}", 1], ["H_2O", 4]]}, {"g": [["Fe^{3+}", 1], ["e^-", 1]], "d": [["Fe^{2+}", 1]]}], "g": [["MnO_4^-", 1], ["H^+", 8], ["Fe^{2+}", 5]], "d": [["Mn^{2+}", 1], ["Fe^{3+}", 5], ["H_2O", 4]], "pouces": ["La première demi-équation échange 5 électrons, la seconde 1 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Multiplie la demi-équation du fer par 5."], "expl": "(Fe^{2+} → Fe^{3+} + e^-) × 5 : MnO_4^- + 8 H^+ + 5 Fe^{2+} → Mn^{2+} + 5 Fe^{3+} + 4 H_2O."}, {"type": "eq", "id": "2g", "enonce": "Une tache de Bétadine (diiode I_2_{(aq)}) disparaît quand on la tamponne avec de la vitamine C, l'acide ascorbique C_6H_8O_6_{(aq)} ; il se forme des ions iodure I^-_{(aq)}.", "demis": [{"g": [["I_2", 1], ["e^-", 2]], "d": [["I^-", 2]]}, {"g": [["C_6H_6O_6", 1], ["H^+", 2], ["e^-", 2]], "d": [["C_6H_8O_6", 1]]}], "g": [["I_2", 1], ["C_6H_8O_6", 1]], "d": [["I^-", 2], ["C_6H_6O_6", 1], ["H^+", 2]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "La vitamine C est le réducteur : écris sa demi-équation à l'envers."], "expl": "I_2 + C_6H_8O_6 → 2 I^- + C_6H_6O_6 + 2 H^+."}, {"type": "eq", "id": "2h", "enonce": "Test de l'eau de Javel (Na^+_{(aq)} + ClO^-_{(aq)}), en milieu basique, avec une solution d'iodure de potassium (K^+_{(aq)} + I^-_{(aq)}) ; il se forme du diiode I_2_{(aq)}.", "demis": [{"g": [["ClO^-", 1], ["H_2O", 1], ["e^-", 2]], "d": [["Cl^-", 1], ["HO^-", 2]]}, {"g": [["I_2", 1], ["e^-", 2]], "d": [["I^-", 2]]}], "g": [["ClO^-", 1], ["I^-", 2], ["H_2O", 1]], "d": [["Cl^-", 1], ["I_2", 1], ["HO^-", 2]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Écris la demi-équation du diiode à l'envers, puis additionne."], "expl": "ClO^- + 2 I^- + H_2O → Cl^- + I_2 + 2 HO^-."}, {"type": "eq", "id": "2i", "enonce": "Au laboratoire, en milieu acide (H^+_{(aq)}), les ions hypochlorite ClO^-_{(aq)} du Dakin oxydent les ions fer(II) d'une solution de sulfate de fer (Fe^{2+}_{(aq)} + SO_4^{2-}_{(aq)}).", "demis": [{"g": [["ClO^-", 1], ["H^+", 2], ["e^-", 2]], "d": [["Cl^-", 1], ["H_2O", 1]]}, {"g": [["Fe^{3+}", 1], ["e^-", 1]], "d": [["Fe^{2+}", 1]]}], "g": [["ClO^-", 1], ["H^+", 2], ["Fe^{2+}", 2]], "d": [["Cl^-", 1], ["Fe^{3+}", 2], ["H_2O", 1]], "pouces": ["La première demi-équation échange 2 électrons, la seconde 1 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Multiplie la demi-équation du fer par 2."], "expl": "(Fe^{2+} → Fe^{3+} + e^-) × 2 : ClO^- + 2 H^+ + 2 Fe^{2+} → Cl^- + 2 Fe^{3+} + H_2O."}, {"type": "eq", "id": "2j", "enonce": "L'eau oxygénée H_2O_2_{(aq)} oxyde, elle aussi, les ions fer(II) d'une solution acidifiée de sulfate de fer (Fe^{2+}_{(aq)} + SO_4^{2-}_{(aq)}).", "demis": [{"g": [["H_2O_2", 1], ["H^+", 2], ["e^-", 2]], "d": [["H_2O", 2]]}, {"g": [["Fe^{3+}", 1], ["e^-", 1]], "d": [["Fe^{2+}", 1]]}], "g": [["H_2O_2", 1], ["H^+", 2], ["Fe^{2+}", 2]], "d": [["H_2O", 2], ["Fe^{3+}", 2]], "pouces": ["La première demi-équation échange 2 électrons, la seconde 1 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Multiplie la demi-équation du fer par 2."], "expl": "H_2O_2 + 2 H^+ + 2 Fe^{2+} → 2 H_2O + 2 Fe^{3+}."}, {"type": "eq", "id": "2k", "enonce": "Une solution de chlorure de fer(III) (Fe^{3+}_{(aq)} + 3 Cl^-_{(aq)}) oxyde les ions iodure d'une solution d'iodure de potassium (K^+_{(aq)} + I^-_{(aq)}) : la solution brunit car il se forme du diiode I_2_{(aq)}.", "demis": [{"g": [["Fe^{3+}", 1], ["e^-", 1]], "d": [["Fe^{2+}", 1]]}, {"g": [["I_2", 1], ["e^-", 2]], "d": [["I^-", 2]]}], "g": [["Fe^{3+}", 2], ["I^-", 2]], "d": [["Fe^{2+}", 2], ["I_2", 1]], "pouces": ["La première demi-équation échange 1 électron, la seconde 2 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Multiplie la demi-équation du fer par 2 et écris celle du diiode à l'envers."], "expl": "2 Fe^{3+} + 2 I^- → 2 Fe^{2+} + I_2."}, {"type": "eq", "id": "2l", "enonce": "Sous la hotte, on verse de l'eau de Javel (Na^+_{(aq)} + ClO^-_{(aq)}) acidifiée (H^+_{(aq)}) sur de la tournure de cuivre Cu_{(s)} ; il se forme des ions cuivre Cu^{2+}_{(aq)} et des ions chlorure Cl^-_{(aq)}.", "demis": [{"g": [["ClO^-", 1], ["H^+", 2], ["e^-", 2]], "d": [["Cl^-", 1], ["H_2O", 1]]}, {"g": [["Cu^{2+}", 1], ["e^-", 2]], "d": [["Cu", 1]]}], "g": [["Cu", 1], ["ClO^-", 1], ["H^+", 2]], "d": [["Cu^{2+}", 1], ["Cl^-", 1], ["H_2O", 1]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Écris la demi-équation du cuivre à l'envers, puis additionne."], "expl": "Cu + ClO^- + 2 H^+ → Cu^{2+} + Cl^- + H_2O."}, {"type": "eq", "id": "2m", "enonce": "Le dichlore Cl_2_{(g)} est détecté avec un papier imbibé d'une solution d'iodure de potassium (K^+_{(aq)} + I^-_{(aq)}) : il se forme du diiode I_2_{(aq)}.", "demis": [{"g": [["Cl_2", 1], ["e^-", 2]], "d": [["Cl^-", 2]]}, {"g": [["I_2", 1], ["e^-", 2]], "d": [["I^-", 2]]}], "g": [["Cl_2", 1], ["I^-", 2]], "d": [["Cl^-", 2], ["I_2", 1]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Le dichlore est l'oxydant ; les ions iodure sont le réducteur."], "expl": "Cl_2 + 2 I^- → 2 Cl^- + I_2."}, {"type": "eq", "id": "2n", "enonce": "Pour aller plus loin. Le laboratoire dose une eau oxygénée H_2O_2_{(aq)} avec une solution acidifiée de permanganate de potassium (K^+_{(aq)} + MnO_4^-_{(aq)}) : il se dégage du dioxygène O_2_{(g)}.", "demis": [{"g": [["MnO_4^-", 1], ["H^+", 8], ["e^-", 5]], "d": [["Mn^{2+}", 1], ["H_2O", 4]]}, {"g": [["O_2", 1], ["H^+", 2], ["e^-", 2]], "d": [["H_2O_2", 1]]}], "g": [["MnO_4^-", 2], ["H_2O_2", 5], ["H^+", 6]], "d": [["Mn^{2+}", 2], ["O_2", 5], ["H_2O", 8]], "pouces": ["La première demi-équation échange 5 électrons, la seconde 2 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Il faut 10 électrons : × 2 pour le permanganate, × 5 pour H_2O_2. Après l'addition, simplifie les H^+ des deux côtés."], "expl": "2 MnO_4^- + 16 H^+ + 5 H_2O_2 → 2 Mn^{2+} + 8 H_2O + 5 O_2 + 10 H^+, soit 2 MnO_4^- + 5 H_2O_2 + 6 H^+ → 2 Mn^{2+} + 5 O_2 + 8 H_2O."}, {"type": "eq", "id": "2o", "enonce": "Alcootest chimique (1). En milieu acide, les ions dichromate (orange) d'une solution de dichromate de potassium (2 K^+_{(aq)} + Cr_2O_7^{2-}_{(aq)}) oxydent l'éthanol C_2H_6O_{(aq)} de l'haleine en éthanal C_2H_4O_{(aq)} ; il se forme des ions Cr^{3+}_{(aq)} (verts).", "demis": [{"g": [["Cr_2O_7^{2-}", 1], ["H^+", 14], ["e^-", 6]], "d": [["Cr^{3+}", 2], ["H_2O", 7]]}, {"g": [["C_2H_4O", 1], ["H^+", 2], ["e^-", 2]], "d": [["C_2H_6O", 1]]}], "g": [["Cr_2O_7^{2-}", 1], ["C_2H_6O", 3], ["H^+", 8]], "d": [["Cr^{3+}", 2], ["C_2H_4O", 3], ["H_2O", 7]], "pouces": ["La première demi-équation échange 6 électrons, la seconde 2 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "× 3 pour l'éthanol (6 électrons). Après l'addition, il y a des ions H^+ des deux côtés : 14 − 6 = 8."], "expl": "Cr_2O_7^{2-} + 14 H^+ + 3 C_2H_6O → 2 Cr^{3+} + 7 H_2O + 3 C_2H_4O + 6 H^+, soit Cr_2O_7^{2-} + 3 C_2H_6O + 8 H^+ → 2 Cr^{3+} + 3 C_2H_4O + 7 H_2O. Le passage de l'orange au vert révèle l'alcool."}, {"type": "eq", "id": "2p", "enonce": "Alcootest chimique (2). Avec plus de temps, les ions dichromate (2 K^+_{(aq)} + Cr_2O_7^{2-}_{(aq)}) oxydent l'éthanol C_2H_6O_{(aq)} jusqu'à l'acide éthanoïque C_2H_4O_2_{(aq)} ; il se forme des ions Cr^{3+}_{(aq)}.", "demis": [{"g": [["Cr_2O_7^{2-}", 1], ["H^+", 14], ["e^-", 6]], "d": [["Cr^{3+}", 2], ["H_2O", 7]]}, {"g": [["C_2H_4O_2", 1], ["H^+", 4], ["e^-", 4]], "d": [["C_2H_6O", 1], ["H_2O", 1]]}], "g": [["Cr_2O_7^{2-}", 2], ["C_2H_6O", 3], ["H^+", 16]], "d": [["Cr^{3+}", 4], ["C_2H_4O_2", 3], ["H_2O", 11]], "pouces": ["La première demi-équation échange 6 électrons, la seconde 4 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Il faut 12 électrons : × 2 pour le dichromate, × 3 pour l'éthanol. Simplifie ensuite les H^+ et H_2O présents des deux côtés."], "expl": "2 Cr_2O_7^{2-} + 28 H^+ + 3 C_2H_6O + 3 H_2O → 4 Cr^{3+} + 14 H_2O + 3 C_2H_4O_2 + 12 H^+, soit 2 Cr_2O_7^{2-} + 3 C_2H_6O + 16 H^+ → 4 Cr^{3+} + 3 C_2H_4O_2 + 11 H_2O."}, {"type": "eq", "id": "2q", "enonce": "Un vieux plateau en fer Fe_{(s)} est plongé dans une solution de sulfate de cuivre (Cu^{2+}_{(aq)} + SO_4^{2-}_{(aq)}), utilisée comme antifongique : il se couvre de cuivre Cu_{(s)} et il se forme des ions fer(II) Fe^{2+}_{(aq)}.", "demis": [{"g": [["Cu^{2+}", 1], ["e^-", 2]], "d": [["Cu", 1]]}, {"g": [["Fe^{2+}", 1], ["e^-", 2]], "d": [["Fe", 1]]}], "g": [["Fe", 1], ["Cu^{2+}", 1]], "d": [["Fe^{2+}", 1], ["Cu", 1]], "pouces": ["Les deux demi-équations échangent déjà 2 électrons : laisse les multiplicateurs sur × 1.", "Le fer est le réducteur : écris sa demi-équation à l'envers. Pense à écrire 1 quand il n'y a qu'une seule entité."], "expl": "Fe + Cu^{2+} → Fe^{2+} + Cu."}, {"type": "eq", "id": "2r", "enonce": "Les ions fer(II) Fe^{2+}_{(aq)} d'un comprimé dissous dans l'eau et laissé à l'air sont oxydés par le dioxygène dissous O_2_{(aq)}, en milieu acide (H^+_{(aq)}) ; il se forme des ions fer(III) Fe^{3+}_{(aq)}.", "demis": [{"g": [["O_2", 1], ["H^+", 4], ["e^-", 4]], "d": [["H_2O", 2]]}, {"g": [["Fe^{3+}", 1], ["e^-", 1]], "d": [["Fe^{2+}", 1]]}], "g": [["Fe^{2+}", 4], ["O_2", 1], ["H^+", 4]], "d": [["Fe^{3+}", 4], ["H_2O", 2]], "pouces": ["La première demi-équation échange 4 électrons, la seconde 1 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Le dioxygène capte 4 électrons : multiplie la demi-équation du fer par 4."], "expl": "(Fe^{2+} → Fe^{3+} + e^-) × 4 : 4 Fe^{2+} + O_2 + 4 H^+ → 4 Fe^{3+} + 2 H_2O."}, {"type": "eq", "id": "2s", "enonce": "La vitamine C (C_6H_8O_6_{(aq)}) d'un jus d'orange laissé à l'air est détruite par le dioxygène dissous O_2_{(aq)} ; il se forme C_6H_6O_6_{(aq)} et de l'eau H_2O_{(l)}.", "demis": [{"g": [["O_2", 1], ["H^+", 4], ["e^-", 4]], "d": [["H_2O", 2]]}, {"g": [["C_6H_6O_6", 1], ["H^+", 2], ["e^-", 2]], "d": [["C_6H_8O_6", 1]]}], "g": [["C_6H_8O_6", 2], ["O_2", 1]], "d": [["C_6H_6O_6", 2], ["H_2O", 2]], "pouces": ["La première demi-équation échange 4 électrons, la seconde 2 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "× 2 pour la vitamine C. Après l'addition, les 4 ions H^+ sont des deux côtés : ils disparaissent."], "expl": "2 C_6H_8O_6 + O_2 + 4 H^+ → 2 C_6H_6O_6 + 4 H^+ + 2 H_2O, soit 2 C_6H_8O_6 + O_2 → 2 C_6H_6O_6 + 2 H_2O."}, {"type": "eq", "id": "2t", "enonce": "Au laboratoire, une solution acidifiée de permanganate de potassium (K^+_{(aq)} + MnO_4^-_{(aq)}) oxyde les ions iodure d'une solution d'iodure de potassium (K^+_{(aq)} + I^-_{(aq)}) : il se forme du diiode I_2_{(aq)} et des ions Mn^{2+}_{(aq)}.", "demis": [{"g": [["MnO_4^-", 1], ["H^+", 8], ["e^-", 5]], "d": [["Mn^{2+}", 1], ["H_2O", 4]]}, {"g": [["I_2", 1], ["e^-", 2]], "d": [["I^-", 2]]}], "g": [["MnO_4^-", 2], ["H^+", 16], ["I^-", 10]], "d": [["Mn^{2+}", 2], ["H_2O", 8], ["I_2", 5]], "pouces": ["La première demi-équation échange 5 électrons, la seconde 2 : choisis les multiplicateurs pour avoir le même nombre d'électrons dans les deux.", "Il faut 10 électrons : × 2 pour le permanganate, × 5 pour le diiode."], "expl": "2 MnO_4^- + 16 H^+ + 10 I^- → 2 Mn^{2+} + 8 H_2O + 5 I_2."}], [{"type": "qcm", "id": "3a", "enonce": "Une agente verse de l'eau de Javel puis un détartrant acide dans des WC. Une odeur piquante se dégage. Quel gaz toxique s'est formé ?", "choix": ["le dichlore Cl_2", "le dioxygène O_2", "le dihydrogène H_2", "la vapeur d'eau H_2O"], "bonne": 0, "pouces": ["Le gaz contient l'élément chlore de l'eau de Javel.", "ClO^- + Cl^- + 2 H^+ → ? + H_2O"], "expl": "Il se forme du dichlore Cl_2, gaz jaune-vert très toxique pour les voies respiratoires."}, {"type": "picto", "id": "3b", "enonce": "Quel pictogramme trouve-t-on sur le gel hydroalcoolique pour signaler qu'il prend feu facilement ?", "choix": ["inflammable", "corrosif", "comburant", "environnement"], "bonne": 0, "pouces": ["Le gel contient beaucoup d'alcool.", "Cherche le pictogramme avec une flamme seule."], "expl": "Le gel hydroalcoolique est inflammable : il faut le tenir loin des flammes."}, {"type": "picto", "id": "3c", "enonce": "Le berlingot d'eau de Javel concentrée peut brûler la peau et les yeux. Quel pictogramme porte-t-il ?", "choix": ["corrosif", "inflammable", "comburant", "toxique"], "bonne": 0, "pouces": ["Pense à un liquide qui « ronge » la main et le métal.", "C'est le pictogramme avec des gouttes qui attaquent une main."], "expl": "Corrosif : il brûle la peau et les yeux et attaque les métaux."}, {"type": "qcm", "id": "3d", "enonce": "Une patiente reçoit une projection d'eau de Javel dans l'œil. Quel est le premier geste ?", "choix": ["rincer abondamment à l'eau pendant au moins 15 minutes", "neutraliser avec quelques gouttes /* ================================================================ écriture chimique
   _2 indice, ^+ ^- ^{2+} exposant, -> flèche, Cl -> Cℓ, I de l'iode à empattements */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function ch(s){
  s = esc(s.replace(/->/g,"→"));
  s = s.replace(/(^|[^A-Za-zÀ-ÿ])Cl(?![a-zà-ÿ])/g,"$1Cℓ");
  s = s.replace(/(^|[^A-Za-zÀ-ÿ(I])I(?=[_^])/g,'$1<span class="iode">I</span>');
  s = s.replace(/\^\{([^}]*)\}/g,(m,a)=>"<sup>"+a.replace(/-/g,"−")+"</sup>");
  s = s.replace(/\^([0-9]*[+\-])/g,(m,a)=>"<sup>"+a.replace(/-/g,"−")+"</sup>");
  s = s.replace(/_\{([^}]*)\}/g,"<sub>$1</sub>").replace(/_(\d+)/g,"<sub>$1</sub>");
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  return s;
}

function mediane(a){ if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y); const m=Math.floor(b.length/2); return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function carte(){

    return `<div class="step ${cls}">
      <div class="row"><div class="num">${st.reussie?"✓":e.id}</div><div><strong>${e.nom}</strong><div class="lieu">${e.lieu}</div></div></div>

  }).join("");
  const fini = S.etapes.every(s=>s.reussie);

let run=null;
function demarrer(i){
  const st=S.etapes[i], banque=ETAPES[i].banque;
  let neufs = shuffle(banque.filter(q=>!st.vus.includes(q.id)));
  if(neufs.length<NB_Q) neufs = neufs.concat(shuffle(banque.filter(q=>!neufs.includes(q))));
  const qs = neufs.slice(0,NB_Q);
  qs.forEach(q=>{ if(!st.vus.includes(q.id)) st.vus.push(q.id); });
  st.tentatives++;
  run={i, qs, n:0, res:[], pouces:[]};
  question();
}

function coefTxt(c){ return c===1?"":c+" "; }
function cote(liste,m){ return liste.map(([sp,c])=>coefTxt(c*m)+ch(sp)).join(" + "); }
function demiTxt(dm,m,inv){ return inv ? cote(dm.d,m)+" = "+cote(dm.g,m) : cote(dm.g,m)+" = "+cote(dm.d,m); }
function majDemi(q,k){
  const dm=q.demis[k], m=run.mult[k], inv=run.inv[k];
  document.getElementById("demiL"+k).innerHTML = cote(inv?dm.d:dm.g, m);
  document.getElementById("demiR"+k).innerHTML = cote(inv?dm.g:dm.d, m);
  ajusterTailles();
}
/* réduit la taille du texte pour que l'équation tienne sur une ligne (minimum lisible, sinon défilement) */
function ajuster(el, maxEm, minEm){
  if(!el) return;
  let t=maxEm; el.style.fontSize=t+"em";
  while(el.scrollWidth>el.clientWidth+1 && t>minEm){ t=Math.round((t-0.03)*100)/100; el.style.fontSize=t+"em"; }
}
function ajusterTailles(){
  ajuster(document.querySelector(".eqline"),1.15,0.62);
  ajuster(document.querySelector(".demiswrap"),1.05,0.6);
}
window.addEventListener("resize",()=>{ if(document.querySelector(".eqline")) ajusterTailles(); });
function ligneEq(q){
  const cases = liste => liste.map(([sp],k)=>`<input class="coef" inputmode="numeric" maxlength="2" aria-label="coefficient de ${sp.replace(/[_^{}]/g,"")}">${ch(sp)}`).join('<span class="op">+</span>');
  return cases(q.g)+'<span class="op">→</span>'+cases(q.d);
}
function eqTxt(q){ return cote(q.g,1)+" → "+cote(q.d,1); }

function question(){
  const e=ETAPES[run.i], q=run.qs[run.n];
  run.t0=Date.now(); sortieQuestion=false; run.used=0; run.locked=false; run.sel=null;
  const dots = run.qs.map((_,k)=>{
    const r=run.res[k]; return `<div class="dot ${k===run.n?"cur":""} ${r===true?"ok":r===false?"ko":""}">${k+1}</div>`;
  }).join("");
  let corps="";
  if(q.donnees) corps += `<div class="donnees"><strong>Données</strong>${q.donnees.map(d=>`<div class="eq">${ch(d)}</div>`).join("")}</div>`;
  if(q.type==="qcm"){
    run.ordre = shuffle(q.choix.map((c,k)=>k));
    corps += `<div class="choices" role="group">${run.ordre.map(k=>`<button class="choice" data-k="${k}">${ch(q.choix[k])}</button>`).join("")}</div>`;
  } else if(q.type==="picto"){
    run.ordre = shuffle(q.choix.map((c,k)=>k));
    corps += `<div class="pictos" role="group">${run.ordre.map(k=>`<button class="picto" data-k="${k}" aria-label="${PICTO_NOM[q.choix[k]]}"><img src="${PICTOS[q.choix[k]]}" alt=""></button>`).join("")}</div>`;
  } else if(q.type==="eq"){
    run.mult = q.demis.map(()=>1); run.inv = q.demis.map(()=>false);
    corps += `<div class="donnees"><strong>Demi-équations</strong> <span class="note">(« ⇄ » retourne la demi-équation, « × » multiplie ses coefficients)</span>
      <div class="demiswrap"><div class="demis">${q.demis.map((dm,k)=>`
        <div class="ctrl"><button type="button" class="inv" data-inv="${k}" aria-pressed="false" title="Retourner la demi-équation">⇄</button>
        <label class="mult">×
        <select data-m="${k}" aria-label="multiplicateur de la demi-équation ${k+1}">${[1,2,3,4,5,6].map(v=>`<option value="${v}">${v}</option>`).join("")}</select></label></div>
        <span class="dl" id="demiL${k}">${cote(dm.g,1)}</span><span class="de">=</span><span class="dr" id="demiR${k}">${cote(dm.d,1)}</span>`).join("")}
      </div></div></div>
      <div class="eqline"><div class="eqin">${ligneEq(q)}</div></div>
      <p class="note">Écris tous les coefficients, avec les plus petits nombres entiers possibles (écris 1 quand il n'y a qu'une seule entité).</p>`;
  } else {
    const parts=q.eq.split("[?]");
    corps += `<div class="eqline">${parts.map((p,k)=>ch(p)+(k<parts.length-1?`<input class="coef" inputmode="numeric" maxlength="2" aria-label="coefficient ${k+1}">`:"")).join("")}</div>
      <p class="note">Écris les nombres manquants dans les cases.</p>`;
  }
  app.innerHTML = `<div class="card">
    <div class="row"><h2 style="margin:0">${e.nom}</h2><div class="sp" style="flex:1"></div><button class="btn ghost" id="coursBtn" style="padding:.3rem .8rem;font-size:.85rem">Revoir le cours</button></div>
    <div class="dots">${dots}</div>
    <p class="enonce">${ch(q.enonce)}</p>
    ${corps}
    <div class="hints">
      <button class="hint-btn" id="h1">💡 Coup de pouce 1</button>
      <button class="hint-btn" id="h2" disabled>💡 Coup de pouce 2</button>
    </div>
    <div id="hintZone"></div>
    <div id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn" id="valider" disabled>Valider</button></div>
  </div>
  <div id="coursZone"></div>`;

  const valider=document.getElementById("valider");
  app.querySelectorAll(".choice,.picto").forEach(b=>b.onclick=()=>{
    if(run.locked) return;
    app.querySelectorAll(".choice,.picto").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); run.sel=+b.dataset.k; valider.disabled=false;
  });
  app.querySelectorAll("input.coef").forEach(inp=>inp.oninput=()=>{
    inp.value=inp.value.replace(/[^0-9]/g,"");
    valider.disabled = [...app.querySelectorAll("input.coef")].some(x=>x.value==="");
  });
  app.querySelectorAll("select[data-m]").forEach(sel=>sel.onchange=()=>{
    if(run.locked) return;
    const k=+sel.dataset.m; run.mult[k]=+sel.value;
    majDemi(q,k);
  });
  app.querySelectorAll("button[data-inv]").forEach(bt=>bt.onclick=()=>{
    if(run.locked) return;
    const k=+bt.dataset.inv; run.inv[k]=!run.inv[k];
    bt.setAttribute("aria-pressed", run.inv[k]); bt.classList.toggle("on", run.inv[k]);
    majDemi(q,k);
  });
  document.getElementById("h1").onclick=()=>pouce(0);
  document.getElementById("h2").onclick=()=>pouce(1);
  document.getElementById("coursBtn").onclick=()=>{
    ACT.coursOuvert++;
    const z=document.getElementById("coursZone");
    z.innerHTML = z.innerHTML?"":`<div class="card"><div class="cours">${e.cours}</div></div>`;
    if(z.innerHTML) z.scrollIntoView({behavior:"smooth"});
  };
  valider.onclick=corriger;
  if(q.type==="eq") requestAnimationFrame(ajusterTailles);
  window.scrollTo(0,0);
}

function pouce(k){
  if(run.locked) return;
  const q=run.qs[run.n];
  if(k===0 && run.used<1){ run.used=1; document.getElementById("h1").disabled=true; document.getElementById("h2").disabled=false; }
  else if(k===1 && run.used<2){ run.used=2; document.getElementById("h2").disabled=true; }
  else return;
  document.getElementById("hintZone").insertAdjacentHTML("beforeend",`<div class="hint">💡 ${ch(q.pouces[k])}</div>`);
}

function corriger(){
  if(run.locked) return;
  run.locked=true;
  const q=run.qs[run.n], st=S.etapes[run.i];
  const dt=(Date.now()-run.t0)/1000;
  let juste;
  let msgEq="";
  if(q.type==="eq"){
    const inps=[...app.querySelectorAll("input.coef")];
    const att=[...q.g,...q.d].map(x=>x[1]);
    const v=inps.map(x=>parseInt(x.value,10));
    juste = v.every((x,k)=>x===att[k]);
    const prop = !juste && v.every(x=>x>0) && v.every((x,k)=>x*att[0]===att[k]*v[0]);
    if(prop) msgEq=" Ton équation est équilibrée, mais il fallait la simplifier (plus petits nombres entiers).";
    inps.forEach((x,k)=>{ x.disabled=true; x.classList.add(v[k]===att[k]?"good":"bad"); });
    app.querySelectorAll("select[data-m],button[data-inv]").forEach(x=>x.disabled=true);
    run.multUtilises = run.mult.map((m,k)=>(run.inv[k]?"⇄":"")+m).join("/");
  } else if(q.type==="coef"){
    const inps=[...app.querySelectorAll("input.coef")];
    juste = inps.every((x,k)=>parseInt(x.value,10)===q.rep[k]);
    inps.forEach((x,k)=>{ x.disabled=true; x.classList.add(parseInt(x.value,10)===q.rep[k]?"good":"bad"); });
  } else {
    juste = run.sel===q.bonne;
    app.querySelectorAll(".choice,.picto").forEach(b=>{
      b.disabled=true; const k=+b.dataset.k;
      if(k===q.bonne) b.classList.add("good"); else if(k===run.sel) b.classList.add("bad");
    });
  }
  document.getElementById("h1").disabled=true; document.getElementById("h2").disabled=true;
  ACT.temps.push(Math.round(dt*10)/10);
  if(dt<RAPIDE_S) ACT.rapides++;
  if(sortieQuestion) ACT.apresSortie++;
  run.res[run.n]=juste;
  if(run.used>0){ st.pouces+=run.used; st.poucesDetail.push(`${q.id}:${run.used}`); }
  st.details.push({essai:st.tentatives, q:q.id, juste, temps:Math.round(dt), pouces:run.used, sortie:sortieQuestion, ...(q.type==="eq"?{mult:run.multUtilises}:{})});
  document.getElementById("fb").innerHTML = `<div class="fb ${juste?"good":"bad"}"><strong>${juste?"Bonne réponse !":"Ce n'est pas ça."}</strong>${msgEq} ${q.type==="eq"?"Réponse : "+eqTxt(q)+". ":""}${ch(q.expl)}</div>`;
  const v=document.getElementById("valider");
  const erreurs = run.res.filter(x=>x===false).length;
  if(erreurs > NB_Q-SEUIL){
    /* trop d'erreurs : l'étape ne peut plus être validée -> retour automatique à la question 1 */
    st.ok = run.res.filter(x=>x).length;
    st.arrets = (st.arrets||0)+1;
    document.getElementById("fb").insertAdjacentHTML("beforeend",
      `<div class="fb bad">⚠️ ${erreurs} erreurs : il faut au moins ${SEUIL} bonnes réponses sur ${NB_Q}. L'étape recommence à la question 1 avec de nouvelles questions.</div>`);
    let n=15;
    const relancer=()=>{ clearInterval(run.chrono); demarrer(run.i); };
    v.textContent=`Recommencer à la question 1 (${n} s)`; v.disabled=false; v.onclick=relancer; v.focus();
    run.chrono=setInterval(()=>{ n--; if(n<=0) relancer(); else v.textContent=`Recommencer à la question 1 (${n} s)`; },1000);
    return;
  }
  v.textContent = run.n<NB_Q-1?"Question suivante":"Voir mon résultat";
  v.disabled=false;
  v.onclick=()=>{ run.n++; run.n<NB_Q?question():bilan(); };
  v.focus();
}

function bilan(){
  const st=S.etapes[run.i], e=ETAPES[run.i];
  const ok=run.res.filter(x=>x).length;
  st.ok=ok;
  const reussi = ok>=SEUIL;
  if(reussi) st.reussie=true;
  const suivante = run.i<ETAPES.length-1;
  app.innerHTML = `<div class="card center">
    <h2>${e.nom}</h2>
    <div class="score">${ok} / ${NB_Q}</div>
    ${reussi
      ? `<p>Étape validée ! ${suivante?"L'étape suivante est débloquée.":"Tu as terminé toutes les étapes."}</p>`
      : `<p>Il faut au moins ${SEUIL} bonnes réponses pour valider l'étape. Relis le cours, puis recommence : tu auras de nouvelles questions.</p>`}
    <div class="row" style="justify-content:center;margin-top:1rem">
      ${reussi?`<button class="btn" id="suite">Continuer</button>`:`<button class="btn" id="retry">Relire le cours et recommencer</button><button class="btn ghost" id="suite">Retour au parcours</button>`}
    </div></div>`;
  document.getElementById("suite").onclick=carte;
  const r=document.getElementById("retry"); if(r) r.onclick=()=>voirCours(run.i,false);
}

/* ================================================================ envoi au worker */
function payload(){
  const tot = NB_Q*ETAPES.length;
  const ok = S.etapes.reduce((a,s)=>a+s.ok,0);
  if(horsDepuis!==null){ ACT.horsMs += Date.now()-horsDepuis; horsDepuis=Date.now(); }
  return {
    prenom:S.eleve.prenom, nom:S.eleve.nom, initiale:S.eleve.nom, classe:S.eleve.classe, jeu:JEU,
    pct:Math.round(100*ok/tot), ok, tot,
    missions: ETAPES.map((e,i)=>{ const s=S.etapes[i]; return {
      mission:e.nom, reussie:s.reussie, tentatives:s.tentatives, arretsApres2Erreurs:s.arrets||0, ok:s.ok, tot:NB_Q,
      coupsDePouce:s.pouces, coupsDePouceDetail:s.poucesDetail.join(" "), details:s.details }; }),
    coupsDePouce: S.etapes.reduce((a,s)=>a+s.pouces,0),
    activite:{
      sortiesPage:ACT.sorties, tempsHorsPage:Math.round(ACT.horsMs/1000), copies:ACT.copies,
      tempsMedian:mediane(ACT.temps), reponsesRapides:ACT.rapides, reponsesApresSortie:ACT.apresSortie,
      coursConsulte:ACT.coursOuvert, versionLisible:!!ACT.versionLisible
    },
    termine:S.etapes.every(s=>s.reussie),
    date:new Date().toISOString()
  };
}

async function envoyer(auto){
  if(TEST || !S.eleve) return;   // mode test : jamais d'envoi
  const zone = document.getElementById("statusFin");
  const dire = m=>{ if(zone) zone.textContent=m; else if(!auto) alert(m); };
  const data = payload();
  try{ localStorage.setItem("hopital_desinf_dernier_envoi", JSON.stringify(data)); }catch(e){}
  try{
    const r = await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    dire("✅ Résultats envoyés à ton professeur.");
  }catch(err){
    dire("⚠️ L'envoi n'a pas fonctionné. Vérifie la connexion puis clique sur « Envoyer mes résultats » en haut de la page.");
  }
}

/* ================================================================ thème */
let THEME = (location.search.match(/[?&]theme=(\w+)/)||[])[1] || "neon";
try{ if(!/[?&]theme=/.test(location.search) && localStorage.getItem("chu_lisible")==="1") THEME="clean"; }catch(e){}
document.body.dataset.theme = THEME;
ACT.versionLisible = THEME==="clean";
const btnLisible=document.getElementById("btnLisible");
function majBoutonLisible(){ const c=document.body.dataset.theme==="clean"; btnLisible.innerHTML = c ? '⚡<span class="lbl"> Version néon</span>' : '👁<span class="lbl"> Version plus lisible</span>'; btnLisible.setAttribute("aria-label", c?"Version néon":"Version plus lisible"); }
majBoutonLisible();
btnLisible.onclick=()=>{
  const lisible = document.body.dataset.theme!=="clean";
  document.body.dataset.theme = lisible ? "clean" : "neon";
  if(lisible) ACT.versionLisible = true;
  try{ localStorage.setItem("chu_lisible", lisible?"1":"0"); }catch(e){}
  majBoutonLisible(); if(surAccueil) demarrerECG(); if(document.querySelector(".eqline")) requestAnimationFrame(ajusterTailles);
};

/* ---------------------------------------------------------------- bip cardiaque (page d'accueil) */
const ECG_T = 1.6;                 // durée d'un tracé (2 battements) en secondes
const PICS = [0.325, 0.65];        // position des pics dans le tracé
let audio=null, sonOn=true, surAccueil=false, ecgT0=0, derPhase=0, rafId=null;
try{ if(localStorage.getItem("chu_son")==="0") sonOn=false; }catch(e){}
const btnSon=document.getElementById("btnSon");
function majBoutonSon(){ btnSon.innerHTML = sonOn ? '🔊<span class="lbl"> Son</span>' : '🔇<span class="lbl"> Son coupé</span>'; btnSon.classList.toggle("hidden", !surAccueil); }
function initAudio(){
  if(!audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audio=null; } }
  if(audio && audio.state==="suspended") audio.resume();
}
function bip(){
  if(!audio || !sonOn || audio.state!=="running") return;
  const t=audio.currentTime, o=audio.createOscillator(), g=audio.createGain();
  o.type="sine"; o.frequency.value=980;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t+0.15);
}
function demarrerECG(){
  const path=document.querySelector(".ecg path");
  document.documentElement.style.setProperty("--ecg-t", ECG_T+"s");
  if(path){ path.style.animation="none"; void path.getBoundingClientRect(); path.style.animation=""; }
  ecgT0=performance.now(); derPhase=0;
}
function boucle(){
  if(!surAccueil){ rafId=null; return; }
  const ph=((performance.now()-ecgT0)/1000/ECG_T)%1;
  PICS.forEach(p=>{ if((derPhase<p && ph>=p) || (ph<derPhase && p>derPhase)) bip(); });
  derPhase=ph; rafId=requestAnimationFrame(boucle);
}
function sonAccueil(actif){
  surAccueil=actif; majBoutonSon();
  if(actif){ demarrerECG(); if(!rafId) rafId=requestAnimationFrame(boucle); }
}
btnSon.onclick=()=>{ sonOn=!sonOn; try{localStorage.setItem("chu_son",sonOn?"1":"0");}catch(e){} initAudio(); majBoutonSon(); };
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ if(surAccueil) initAudio(); }));
if(THEME==="bio"){
  const d=document.getElementById("deco"); let h="";
  const cols=["#7CF29C","#B892FF","#4FD1C5","#FFD166"];
  for(let k=0;k<7;k++){ const s=60+Math.random()*160, c=cols[k%4];
    h+=`<div class="blob" style="width:${s}px;height:${s}px;left:${Math.random()*95}%;top:${Math.random()*90}%;background:radial-gradient(circle at 35% 35%,${c}88,${c}11 70%);animation-delay:-${k*3}s"></div>`; }
  for(let k=0;k<6;k++){ const c=cols[(k+1)%4];
    h+=`<svg class="bact" width="90" height="40" style="left:${Math.random()*92}%;top:${Math.random()*92}%;animation-delay:-${k*4}s" viewBox="0 0 90 40"><rect x="5" y="5" width="80" height="30" rx="15" fill="${c}33" stroke="${c}" stroke-width="2"/><path d="M25,20 q5,-8 10,0 t10,0 t10,0" stroke="${c}" stroke-width="2" fill="none"/></svg>`; }
  d.innerHTML=h;
}
accueil();
</script>
